name: Shop source-qualified offer detail receiving

on:
  pull_request:
    paths:
      - 'src/service-discovery.mjs'
      - 'src/worker.mjs'
      - 'test/service-offer.test.mjs'
      - 'test/service-discovery.test.mjs'
      - '.github/workflows/source-qualified-service-offers.yml'
  push:
    branches: [main]
    paths:
      - 'src/service-discovery.mjs'
      - 'src/worker.mjs'
      - 'test/service-offer.test.mjs'
      - 'test/service-discovery.test.mjs'
      - '.github/workflows/source-qualified-service-offers.yml'

permissions:
  contents: read

concurrency:
  group: shop-service-offer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-offer-reading:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.18.0'
      - name: Check original module and tests parse
        run: |
          node --check src/service-discovery.mjs
          node --check src/worker.mjs
          node --check test/service-discovery.test.mjs
          node --check test/service-offer.test.mjs
      - name: Receive directory and exact-offer source journeys
        run: node --test --test-reporter=tap test/service-discovery.test.mjs test/service-offer.test.mjs
