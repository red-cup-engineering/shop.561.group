name: Publication source preflight
# A public PR receives only source-independent, synthetic original Shop checks.
# Causeway's original merchant parameters are private and never checked out
# by an untrusted pull_request runner. Native integration is separately owned
# by the trusted-main release qualification in Shop PR #20.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publication-source-preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    name: Original Shop public source contracts (not private integration)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Refuse private merchant records in untrusted CI
        run: |
          if test -f parameters/catalog.json; then
            echo "::error::Private original Causeway parameters must not enter public source CI"
            exit 1
          fi
      - name: Receive original source campaign/checkout observation semantics
        run: |
          node --check src/support-checkout-attribution.mjs
          node --check scripts/reconcile-support-checkouts.mjs
          node --check src/support-public-probe.mjs
          node --check scripts/probe-public-support.mjs
          node --test test/support-checkout-attribution.test.mjs test/support-public-probe.test.mjs test/support-worker-routing.test.mjs
      - name: Retain independent public discovery and publication controls
        run: |
          node --check src/service-discovery.mjs
          node --check src/book-feed.mjs
          node --test test/publication-source-preflight.test.mjs test/service-discovery.test.mjs test/book-feed.test.mjs
      - name: Explicitly withhold private Worker and payment acceptance
        run: |
          echo "SOURCE-ONLY qualification. Original private Causeway parameters, frozen dependencies, Worker build/release, full Shop integration, authored book releases, source-qualified actual payee, buyer settlement and delivered customer Work remain unreceived." >> "$GITHUB_STEP_SUMMARY"
          echo "Do not use this public PR's green source job as merge, deployment, signed Checkout or accepted customer receipt." >> "$GITHUB_STEP_SUMMARY"

  # An independently executed unsigned network diagnostic. Source-qualified
  # merchant/payee/catalog receiving remains in the ORIGINAL stronger Shop
  # receiver and trusted release owner; this job may assert only HTTP status
  # of fixed original support routes, not correct product/merchant delivery.
  installed-route-presence:
    name: Installed Shop support route presence (NOT merchant acceptance)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Observe public original support paths without secret source or checkout
        run: |
          set -eu
          failures=0
          while read -r expected method route; do
            test -n "$expected" || continue
            case "$method" in
              HEAD) actual=$(curl --silent --show-error --max-time 8 --max-redirs 0 --head --output /dev/null --write-out '%{http_code}' "https://shop.561.group$route") || actual="transport-unavailable" ;;
              GET|POST) actual=$(curl --silent --show-error --max-time 8 --max-redirs 0 --request "$method" --output /dev/null --write-out '%{http_code}' "https://shop.561.group$route") || actual="transport-unavailable" ;;
              *) exit 2 ;;
            esac
            printf '%s %s expected=%s observed=%s\n' "$method" "$route" "$expected" "$actual"
            if test "$actual" != "$expected"; then failures=$((failures+1)); fi
          done <<'ROUTES'
          200 GET /support
          200 HEAD /support
          200 GET /support/share.json
          303 GET /support/go?kind=one-time&source=direct
          303 HEAD /support/go?kind=one-time&source=direct
          303 GET /support/go?kind=monthly&source=direct
          405 POST /support
          404 GET /support/go?kind=invalid
          ROUTES
          echo "Unsigned route-presence diagnostic only; source merchant, destination, payment, release and customer delivery NOT independently accepted." >> "$GITHUB_STEP_SUMMARY"
          if test "$failures" -ne 0; then echo "::error::Public Shop route presence unreceived: $failures of 8 failed"; exit 1; fi
